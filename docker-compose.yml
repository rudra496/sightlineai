version: "3.9"

services:
  sightlineai:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PRODUCTION=false
      - PERSIST_HISTORY=false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
